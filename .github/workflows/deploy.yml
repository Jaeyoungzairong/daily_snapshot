name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Build web
        run: |
          APP_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          flutter build web --base-href "/${{ github.event.repository.name }}/" \
            --dart-define=KMA_SERVICE_KEY=${{ secrets.KMA_SERVICE_KEY }} \
            --dart-define=APP_VERSION="$APP_VERSION"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
