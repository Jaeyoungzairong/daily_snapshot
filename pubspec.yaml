name: daily_snapshot
description: "A new Flutter project."
publish_to: 'none'
version: 26.9.29+1

environment:
  sdk: ^3.13.1

dependencies:
  cloud_firestore: ^6.9.0
  file_picker: ^13.1.0
  file_saver: ^0.4.0
  firebase_auth: ^6.6.1
  firebase_core: ^4.14.0
  firebase_storage: ^13.5.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  google_sign_in: ^7.2.0
  http: ^1.6.0
  package_info_plus: ^10.2.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/kma_regions.json
    - assets/images/app_icon.png
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600

# 안드로이드 런처 아이콘 생성 설정. `dart run flutter_launcher_icons`로 android/app/src/main/res의
# mipmap PNG와 적응형 아이콘(Android 8+)을 다시 만든다. 원본은 웹 아이콘을 그대로 쓴다 — 전경은
# 글자 주변 여백이 큰 maskable 버전이라 원형 런처 마스크에도 잘리지 않고, 배경색은 로고 파란색과 같다.
flutter_launcher_icons:
  android: true
  ios: false
  web:
    generate: false
  image_path: web/icons/Icon-512.png
  adaptive_icon_background: "#0B5FA5"
  adaptive_icon_foreground: web/icons/Icon-maskable-512.png
  # 기본값(16%)은 전경을 한 번 더 줄여 넣는데, maskable 이미지는 이미 글자 주변에 여백이 있어
  # 글자가 너무 작아진다. 여백 없이 써도 글자의 가장 먼 픽셀(중심에서 145px/512)이 안드로이드
  # 안전 영역(156px) 안이라 원형 등 어떤 런처 마스크에서도 잘리지 않는다.
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 21
